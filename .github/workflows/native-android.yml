name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "native/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create SDK wrapper files
        run: flutter create --platforms=android --org com.ibrahimgaya25 --project-name dayflow_native .
      - name: Install packages
        run: flutter pub get
      - name: Format generated checkout
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test import compatibility and task rules
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-android-${{ github.run_number }}
          path: native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
