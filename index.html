    '<div class="set-group"><h3>Appearance</h3>' + seg('set-theme', [['system', 'Match device'], ['light', 'Light'], ['dark', 'Dark']], p.theme) + '</div>' +
    '<div class="set-group"><h3>Default focus length</h3>' + seg('set-focus', DURATIONS.map(d => [d, d + ' min']), p.focusMin) + '</div>' +
    '<div class="set-group"><h3>Chime when a session ends</h3>' + seg('set-chime', [['on', 'On'], ['off', 'Off']], p.chime ? 'on' : 'off') + '</div>' +
    (hosted && !standalone() ? '<div class="set-group"><h3>Install DayFlow</h3>' + (installEvt ? '<button class="btn primary block" data-act="install">Add to home screen</button>' : '<p class="note" style="margin:0">' + (isIOS ? 'In Safari, tap the Share button, then “Add to Home Screen”.' : 'Open your browser’s menu and choose “Install app” or “Add to Home screen”.') + '</p>') + '<p class="note">DayFlow then opens full screen from its own icon and works offline.</p></div>' : '') +
    '<div class="set-group"><h3>Tips on Today</h3>' + seg('set-tips', [['all', 'DayFlow’s and mine'], ['mine', 'Only mine']], p.ownTipsOnly ? 'mine' : 'all') + '</div>' +
    '<div class="set-group"><h3>Categories</h3><div class="card">' + state.categories.map(c => { const n = state.tasks.filter(t => t.categoryId === c.id).length;
      return '<div class="cat"><i class="sw" style="--c:' + esc(c.color) + '"></i><span>' + esc(c.name) + '</span><small>' + plural(n, 'task') + '</small>' + (c.isDefault ? '' : '<button class="icon-btn" data-act="del-cat" data-id="' + esc(c.id) + '" aria-label="Delete category ' + esc(c.name) + '">' + ic.trash + '</button>') + '</div>'; }).join('') + '</div>' +
      '<div class="newcat"><input id="newCat" type="text" maxlength="30" placeholder="New category name" aria-label="New category name"><button class="btn primary" data-act="add-cat">Add</button></div>' +
      '<div class="swatches" role="group" aria-label="Category colour">' + SWATCHES.map(s => '<button data-act="swatch" data-c="' + s + '" style="--c:' + s + '" aria-pressed="' + (ui.newCatColor === s) + '" aria-label="Colour ' + s + '"></button>').join('') + '</div></div>' +
    '<div class="set-group"><h3>Your data</h3><div class="stack"><button class="btn" data-act="export">Export data</button><button class="btn" data-act="import">Import data</button><button class="btn danger" data-act="reset">Reset DayFlow</button></div>' +
      '<p class="note">' + (cloud.on ? 'Your tasks are saved privately to your Claude account and on this device.' : 'Your tasks are saved in this browser, on this device only.') + ' Export a copy to keep a backup.</p></div>';
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = keep ? y : 0;
}
/* Tip widgets in the greeting banner: the person's own tips first, then DayFlow's, starting with today's. */
const MAX_TIPS = 20;
function tipList(){
  const start = Math.floor(Date.now() / 864e5) % TIPS.length;
  const built = state.prefs.ownTipsOnly ? [] : TIPS.slice(start).concat(TIPS.slice(0, start));
  return state.tips.map(t => ({id:t.id, text:t.text, mine:true})).concat(built.map((t, i) => ({text:t, mine:false, label:i === 0 ? 'Tip for today' : 'DayFlow tip'})));
}
const TIP_MS = 6000;
let tipT = 0, flipping = false;
const tipsPaused = () => ui.tipPaused == null ? calm() : ui.tipPaused;
/* Every tip is laid in the same spot and only the current one shows, so the block keeps one height while it flips. */
function tipStrip(){
  const list = tipList();
  if (!list.length) return '<div class="tipbox"><button class="tipadd" data-act="add-tip">' + ic.plus + 'Add your own tip</button></div>';
  const many = list.length > 1, auto = many && !tipsPaused();
  return '<div class="tipbox"><div class="tipcard' + (auto ? ' auto' : '') + '" id="tipcard">' +
    '<button class="faces" data-act="tip-next"' + (many ? '' : ' disabled') + '>' + list.map(t => '<span class="face">' + esc(t.text) + '</span>').join('') + '</button>' +
    '<div class="foot"><span id="tipWho"></span><span class="acts"><button class="rm" data-act="del-tip" hidden>Remove</button>' +
    (many ? '<button class="tb" data-act="tip-pause" aria-label="' + (auto ? 'Pause tips' : 'Play tips') + '">' + (auto ? ic.pause : ic.play) + '</button>' : '') +
    '<button class="tb add" data-act="add-tip" aria-label="Add your own tip">' + ic.plus + '</button></span></div></div></div>';
}
function showTip(i){
  const card = $('#tipcard'), list = tipList(); if (!card || !list.length) return;
  ui.tipI = ((i % list.length) + list.length) % list.length;
  const t = list[ui.tipI];
  card.querySelectorAll('.face').forEach((f, k) => f.classList.toggle('on', k === ui.tipI));
  card.classList.toggle('mine', t.mine);
  $('#tipWho').textContent = t.mine ? 'Your tip' : t.label;
  const rm = card.querySelector('.rm'); rm.hidden = !t.mine;
  if (t.mine){ rm.dataset.id = t.id; rm.setAttribute('aria-label', 'Remove your tip: ' + t.text); }
}
function flipTip(){
  const card = $('#tipcard'); if (!card || flipping || tipList().length < 2) return;
  const next = ui.tipI + 1;
  if (calm() || !card.animate){ showTip(next); return; }
  flipping = true;
  const out = card.animate([{transform:'rotateX(0deg)', opacity:1}, {transform:'rotateX(88deg)', opacity:.25}], {duration:230, easing:'ease-in'});
  out.onfinish = () => {
    const c = $('#tipcard'); showTip(next);
    if (!c || !c.animate){ flipping = false; return; }
    const back = c.animate([{transform:'rotateX(-88deg)', opacity:.25}, {transform:'rotateX(0deg)', opacity:1}], {duration:340, easing:'cubic-bezier(.2,.8,.3,1.25)'});
    back.onfinish = back.oncancel = () => { flipping = false; };
  };
  out.oncancel = () => { flipping = false; };
}
function armTips(){
  clearInterval(tipT); tipT = 0;
  const card = $('#tipcard'); if (!card || !card.classList.contains('auto')) return;
  card.classList.remove('auto'); void card.offsetWidth; card.classList.add('auto'); /* restart the gold line with the timer */
  tipT = setInterval(() => { if (!document.hidden && !sheet.open && !modal.open) flipTip(); }, TIP_MS);
}
function runTips(){
  flipping = false; clearInterval(tipT); tipT = 0;
  if (!$('#tipcard')) return;
  showTip(ui.tipI); armTips();
}
function openTipBox(){
  if (state.tips.length >= MAX_TIPS){ toast('You can keep up to ' + MAX_TIPS + ' tips. Remove one first.'); return; }
  modal.innerHTML = '<h2>Add your own tip</h2><p>A reminder or a motto you want to see at the top of your day.</p><textarea id="tipText" class="plain" maxlength="140" placeholder="For example: Drink water before coffee." aria-label="Your tip"></textarea><p class="count" id="tipCount">0 of 140</p><p class="err" id="tipErr" role="alert" hidden>Write the tip before adding it.</p><div class="sheet-actions"><button class="btn" data-x="close">Cancel</button><button class="btn primary" data-x="add">Add tip</button></div>';
  const ta = $('#tipText');
  ta.oninput = () => { $('#tipCount').textContent = ta.value.length + ' of 140'; if (ta.value.trim()) $('#tipErr').hidden = true; };
  modal.onclick = e => {
    const b = e.target.closest('[data-x]');
    if (!b){ if (e.target === modal) modal.close(); return; }
    if (b.dataset.x === 'close') return modal.close();
    const text = ta.value.trim().replace(/\s+/g, ' ').slice(0, 140);
    if (!text){ $('#tipErr').hidden = false; ta.focus(); return; }
    state.tips.unshift({id:'t' + newId(), text:text, createdAt:new Date().toISOString()}); ui.tipI = 0; save(); modal.close(); render(); toast('Tip added');
  };
  modal.onclose = () => { modal.onclick = modal.onclose = null; };
  modal.showModal(); ta.focus();
}
function exportPayload(){ return {app:'dayflow', v:1, exportedAt:new Date().toISOString(), rev:state.rev, prefs:state.prefs, categories:state.categories, tasks:state.tasks, sessions:state.sessions, tips:state.tips, badges:state.badges}; }
async function doExport(){
  const json = JSON.stringify(exportPayload(), null, 2), name = 'dayflow-export-' + today() + '.json';
  if (window.claude && typeof window.claude.use === 'function'){
    try { const dl = await window.claude.use('downloads'); if (dl){ await dl.save({filename:name, data:json}); toast('Export saved'); return; } }
    catch (e){ if (e && e.code === 'declined') return; }
    modal.innerHTML = '<h2>Export data</h2><p>Copy this text and keep it somewhere safe. Paste it into Import data to restore it.</p><textarea readonly aria-label="Exported data">' + esc(json) + '</textarea><div class="sheet-actions"><button class="btn" data-x="close">Close</button><button class="btn primary" data-x="copy">Copy</button></div>';
    modal.onclick = e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'copy'){ const ta = modal.querySelector('textarea'); ta.select(); try { navigator.clipboard.writeText(json).then(() => toast('Copied'), () => { document.execCommand('copy'); toast('Copied'); }); } catch (err){ document.execCommand('copy'); toast('Copied'); } } else modal.close(); };
    modal.onclose = () => { modal.onclick = modal.onclose = null; };
    modal.showModal(); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Export saved');
}
function openImport(){
  modal.innerHTML = '<h2>Import data</h2><p>Choose a DayFlow export file, or paste its contents below. Importing replaces what is in DayFlow now.</p><input id="impFile" type="file" accept=".json,application/json" hidden><button class="btn block" data-x="file" style="margin-bottom:10px">Choose file</button>' +
    '<textarea id="impText" placeholder="Or paste the exported text here" aria-label="Exported data"></textarea><p class="err" id="impErr" role="alert" hidden></p><div class="sheet-actions"><button class="btn" data-x="close">Cancel</button><button class="btn primary" data-x="go">Import</button></div>';
  const err = m => { const e = $('#impErr'); e.textContent = m; e.hidden = false; };
  $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#impText').value = String(r.result || ''); $('#impErr').hidden = true; }; r.onerror = () => err('That file could not be read.'); r.readAsText(f); };
  modal.onclick = async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'file') return $('#impFile').click();
    if (b.dataset.x === 'close') return modal.close();
    const txt = $('#impText').value.trim();
    if (!txt) return err('Choose a file or paste the exported text first.');
    let parsed; try { parsed = JSON.parse(txt); } catch (x){ return err('This is not valid JSON, so nothing was imported.'); }
    const r = validateData(parsed);
    if (!r.ok) return err(r.error + ' Nothing was imported.');
    /* the confirmation takes over the open dialog, so no stale close event can answer it */
    const ok = await confirmBox({title:'Replace your data?', body:'This import has ' + plural(r.data.tasks.length, 'task') + ' and ' + plural(r.data.sessions.length, 'focus session') + '. It will replace everything in DayFlow now.', ok:'Replace', danger:true});
    if (!ok) return;
    r.data.prefs.onboarded = true; state = r.data; timer = null; saveTimer(); save(); openSettings(); render(); toast('Data imported');
  };
  modal.onclose = () => { modal.onclick = modal.onclose = null; };
  modal.showModal();
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  if (e.target === sheet){ closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'go': go(el.dataset.v); break;
    case 'settings': openSettings(); break;
    case 'close-sheet': closeSheet(); break;
    case 'new-task': {
      /* play the reaction first, then open the form, so the sheet does not cover it */
      const d = el.dataset.d;
      if (calm()){ openTask(null, d); break; }
      if (el.classList.contains('burst')) break;
      el.classList.add('burst');
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (x) {}
      setTimeout(() => { el.classList.remove('burst'); openTask(null, d); }, 300);
      break; }
    case 'edit': openTask(id); break;
    case 'toggle': toggleTask(id); break;
    case 'undo': undo(); break;
    case 'sub-add': addSub(); break;
    case 'sub-toggle': { const x = ui.subs[Number(el.dataset.i)]; if (x){ x.done = !x.done; subsChanged(); } break; }
    case 'sub-del': ui.subs.splice(Number(el.dataset.i), 1); subsChanged(); break;
    case 'badge-open': if (el.id === 'cheer') endCheer(); openBadge(el.dataset.id); break;
    case 'roll': rollOver(el.dataset.m); break;
    case 'set-chime': state.prefs.chime = el.dataset.v === 'on'; save(); if (state.prefs.chime){ primeAudio(); chime(); } openSettings(true); break;
    case 'install': if (installEvt){ const ev = installEvt; installEvt = null; try { ev.prompt(); } catch (x) {} openSettings(true); } break;
    case 'samples': addSamples(); break;
    case 'tip-next': flipTip(); armTips(); break;
    case 'tip-pause': ui.tipPaused = !tipsPaused(); render(); break;
    case 'add-tip': openTipBox(); break;
    case 'del-tip': { const tp = state.tips.find(x => x.id === id); if (!tp) break;
      if (await confirmBox({title:'Remove this tip?', body:'“' + tp.text + '”', ok:'Remove tip', cancel:'Keep tip', danger:true})){
        state.tips = state.tips.filter(x => x.id !== id); save(); render(); toast('Tip removed'); } break; }
    case 'set-tips': state.prefs.ownTipsOnly = el.dataset.v === 'mine'; ui.tipI = 0; save(); openSettings(true); render(); break;
    case 'mode': ui.mode = el.dataset.m; render(); break;
    case 'pick-day': ui.date = el.dataset.d; render(); break;
    case 'week': ui.date = addDays(ui.date, Number(el.dataset.n)); render(); break;
    case 'fstatus': ui.fStatus = el.dataset.s; render(); break;
    case 'clear-filters': ui.q = ''; ui.fStatus = 'all'; ui.fCat = 'all'; render(); break;
    case 'set-date': { const f = $('#taskForm'); f.elements.date.value = el.dataset.d; f.querySelectorAll('[data-act=set-date]').forEach(b => b.setAttribute('aria-pressed', b === el)); break; }
    case 'clear-time': $('#taskForm').elements.time.value = ''; break;
    case 'toggle-in-sheet': { const tid = $('#taskForm').dataset.id; closeSheet(); toggleTask(tid); break; }
    case 'delete-task': {
      const tid = $('#taskForm').dataset.id, t = state.tasks.find(x => x.id === tid); if (!t) break;
      if (await confirmBox({title:'Delete this task?', body:'“' + t.title + '” will be removed for good.', ok:'Delete task', cancel:'Keep task', danger:true})){
        snap(); state.tasks = state.tasks.filter(x => x.id !== tid); if (ui.focusTask === tid) ui.focusTask = null; save(); closeSheet(); render(); toast('Task deleted', true);
      } break; }
    case 'pick-focus': openFocusPicker(); break;
    case 'choose-focus': ui.focusTask = id || null; closeSheet(); render(); break;
    case 'dur': ui.focusMin = Number(el.dataset.n); render(); break;
    case 't-start': startTimer('focus', ui.focusTask, ui.focusMin || state.prefs.focusMin); break;
    case 't-pause': pauseTimer(); break;
    case 't-resume': resumeTimer(); break;
    case 't-reset': resetTimer(); break;
    case 't-clear': timer = null; saveTimer(); render(); break;
    case 't-break': startTimer('break', null, BREAK_MIN); break;
    case 't-done-task': { const t = timer && state.tasks.find(x => x.id === timer.taskId); if (t && !t.done){ snap(); setDone(t, true); save(); render(); toast('Task completed', true); } else render(); break; }
    case 'ob-next': if (ui.ob.step < 2) ui.ob.step++; render(); break;
    case 'ob-back': if (ui.ob.step > 0) ui.ob.step--; render(); break;
    case 'ob-skip': finishOnboarding(true); break;
    case 'ob-done': finishOnboarding(false); break;
    case 'ob-int': { const x = el.dataset.x, L = ui.ob.interests;
      if (x === 'Everything') ui.ob.interests = L.includes(x) ? [] : ['Everything'];
      else { const i = L.indexOf(x); if (i >= 0) L.splice(i, 1); else L.push(x); ui.ob.interests = L.filter(v => v !== 'Everything'); }
      render(); break; }
    case 'set-theme': state.prefs.theme = el.dataset.v; save(); applyTheme(); openSettings(true); break;
    case 'set-focus': state.prefs.focusMin = Number(el.dataset.v); ui.focusMin = null; save(); openSettings(true); render(); break;
    case 'swatch': ui.newCatColor = el.dataset.c; { const keepName = $('#newCat').value; openSettings(true); $('#newCat').value = keepName; } break;
    case 'add-cat': { const inp = $('#newCat'), name = inp.value.trim().slice(0, 30);
      if (!name){ inp.focus(); toast('Type a category name first'); break; }
      if (state.categories.some(c => c.name.toLowerCase() === name.toLowerCase())){ toast('That category already exists'); break; }
      state.categories.push({id:'c' + newId(), name:name, color:ui.newCatColor, isDefault:false}); save(); openSettings(true); render(); toast('Category added'); break; }
    case 'del-cat': { const c = state.categories.find(x => x.id === id); if (!c || c.isDefault) break;
      const n = state.tasks.filter(t => t.categoryId === id).length;
      if (await confirmBox({title:'Delete “' + c.name + '”?', body:n ? plural(n, 'task') + ' in this category will move to Other.' : 'No tasks use this category.', ok:'Delete category', danger:true})){
        state.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = 'other'; }); state.categories = state.categories.filter(x => x.id !== id); if (ui.fCat === id) ui.fCat = 'all';
        save(); openSettings(true); render(); toast('Category deleted'); } break; }
    case 'export': doExport(); break;
    case 'import': openImport(); break;
    case 'reset':
      if (await confirmBox({title:'Reset DayFlow?', body:'This deletes all your tasks, categories, focus sessions and settings. It cannot be undone.', ok:'Reset everything', danger:true})){
        state = defaults(); timer = null; saveTimer(); ui.ob = {step:0, name:'', interests:[]}; ui.focusTask = null; ui.date = today(); save(); closeSheet(); render(); toast('DayFlow has been reset');
      } break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'taskForm'){ e.preventDefault(); saveTaskForm(e.target); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ ui.q = t.value; $('#allList').innerHTML = allList(); }
  else if (t.id === 'obName') ui.ob.name = t.value;
  else if (t.name === 'title' && t.value.trim()){ $('#titleErr').hidden = true; $('#titleField').classList.remove('bad'); }
  else if (t.name === 'date' && t.form) t.form.querySelectorAll('[data-act=set-date]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === t.value));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fcat'){ ui.fCat = t.value; render(); }
  else if (t.id === 'setName'){ state.prefs.name = t.value.trim().slice(0, 30); save(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'obName'){ e.preventDefault(); ui.ob.step = 2; render(); }
  if (e.key === 'Enter' && e.target.id === 'subNew'){ e.preventDefault(); addSub(); }   /* Enter adds the step instead of saving the task */
});
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); if (timer && timer.status === 'running'){ ensureTick(); keepAwake(true); } if (ui.date < today() && route() === 'today') ui.date = today(); if (state.prefs.onboarded && !sheet.open && !modal.open && !timer) render(); } });
window.addEventListener('pageshow', tick);

/* ---------- swipe a task row ---------- */
const SWIPE_AT = 84, SW = {el:null, x0:0, y0:0, dx:0, on:false, hot:false, pid:null};
let swipeEndedAt = 0;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const row = e.target.closest ? e.target.closest('.sw') : null;
  if (!row || sheet.open || modal.open) return;
  SW.el = row; SW.x0 = e.clientX; SW.y0 = e.clientY; SW.dx = 0; SW.on = false; SW.hot = false; SW.pid = e.pointerId;
});
document.addEventListener('pointermove', e => {
  if (!SW.el || e.pointerId !== SW.pid) return;
  const dx = e.clientX - SW.x0, dy = e.clientY - SW.y0;
  if (!SW.on){
    if (Math.abs(dy) > 12 && Math.abs(dy) >= Math.abs(dx)){ SW.el = null; return; }   /* it is a scroll */
    if (Math.abs(dx) < 12) return;
    SW.on = true; SW.el.classList.remove('snap');
    try { SW.el.setPointerCapture(e.pointerId); } catch (x) {}
  }
  let x = Math.max(-150, Math.min(150, dx));
  if (x < 0 && SW.el.dataset.done === '1') x = 0;   /* a completed task only swipes right, to reopen it */
  SW.dx = x;
  const go = SW.el.querySelector('.go'), mv = SW.el.querySelector('.mv');
  SW.el.querySelector('.task').style.transform = 'translateX(' + x + 'px)';
  go.style.width = Math.max(0, x - 2) + 'px'; mv.style.width = Math.max(0, -x - 2) + 'px';
  const hot = Math.abs(x) >= SWIPE_AT; if (hot && !SW.hot) buzz(10); SW.hot = hot;
  go.classList.toggle('hot', hot && x > 0); mv.classList.toggle('hot', hot && x < 0);
});
function endSwipe(e, cancelled){
  if (!SW.el || e.pointerId !== SW.pid) return;
  const row = SW.el, x = SW.dx, was = SW.on; SW.el = null; SW.on = false; SW.hot = false;
  if (!was) return;
  swipeEndedAt = e.timeStamp || 1;   /* the lift at the end of a swipe is not a tap */
  if (!cancelled && Math.abs(x) >= SWIPE_AT){ state.prefs.swiped = true; if (x > 0) toggleTask(row.dataset.id); else moveNextDay(row.dataset.id); return; }
  row.classList.add('snap'); row.querySelector('.task').style.transform = '';
  row.querySelectorAll('.sw-a').forEach(a => { a.style.width = '0px'; a.classList.remove('hot'); });
}
document.addEventListener('pointerup', e => endSwipe(e, false));
document.addEventListener('pointercancel', e => endSwipe(e, true));
document.addEventListener('click', e => { const t = swipeEndedAt; swipeEndedAt = 0; if (t && e.timeStamp - t < 80){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('touchstart', function(){}, {passive:true}); /* lets :active press states fire on iOS */
window.addEventListener('pagehide', () => { if (cloud.dirty) flush(); });

/* ================= start ================= */
render();
if (timer && timer.status === 'running'){ ensureTick(); tick(); }
initCloud();
})();
</script>
